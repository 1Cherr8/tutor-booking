services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tutor_booking
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d tutor_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@db:5432/tutor_booking
      JWT_SECRET: dev-secret-key-change-me-please-1234567890
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin12345
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
